name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: kleinbem/actions/.github/workflows/zizmor.yaml@d5aec5d8fbed30867e0b2c1d781992844240ee1e # v1.10.0

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@d5aec5d8fbed30867e0b2c1d781992844240ee1e # v1.10.0
      - name: Build the held packages
        run: nix flake check
      # flake check doesn't build the web app; this is what catches a bad npm bump.
      - name: Build web
        run: nix build .#web
      - name: Formatting
        run: nix fmt -- --fail-on-change
