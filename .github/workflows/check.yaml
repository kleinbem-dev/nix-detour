name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: kleinbem/actions/.github/workflows/zizmor.yaml@8d97c5a48bf3966994d5747c07f096938b8ecea5 # v1.8.0

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@8d97c5a48bf3966994d5747c07f096938b8ecea5 # v1.8.0
      - name: Build the held packages
        run: nix flake check
      # flake check doesn't build the web app; this is what catches a bad npm bump.
      - name: Build web
        run: nix build .#web
      - name: Formatting
        run: nix fmt -- --fail-on-change
